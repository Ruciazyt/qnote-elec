<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }

        #circle {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00bcd4, #2196f3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #circle::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #circle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
        }

        #circle:hover::before {
            opacity: 1;
        }

        .note-icon {
            width: 24px;
            height: 24px;
            position: relative;
            transform: rotate(-15deg);
        }

        .note-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 2px;
            transform: rotate(15deg);
        }

        .note-icon::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 8px;
            height: 8px;
            background: #2196f3;
            border-radius: 50%;
            transform: rotate(15deg);
        }
    </style>
</head>

<body>
    <div id="circle">
        <div class="note-icon"></div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        const circle = document.getElementById('circle');
        circle.addEventListener('click', () => {
            ipcRenderer.send('circle-click');
        });
    </script>
</body>

</html>
