name: Build and Release

# -----------------------------------------------------------------------
# 正式发布 —— 由版本号 tag 触发。
#
# tag 名 = 版本号本身，MAJOR.MINOR.PATCH 三段纯数字，**不带 v 前缀**
# （AGENTS.md 第 3.3 节）。例：1.0.19
#
# 所以触发模式用 [0-9]+ 三段数字，而不是 v* —— 早先混用过 v1.0.x 与
# 1.0.<commit 数> 两种形态，Release 列表因此出现两串同号条目。
# -----------------------------------------------------------------------

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # actions: write —— 删未签名的 artifact 要调 REST 接口
    # contents: read —— checkout 读代码
    permissions:
      actions: write
      contents: read
    # Release 页正文要区分三种签名状态（SignPath / 公共 CA 证书 / 无签名），
    # 所以把签名方式透传给 release 作业。
    outputs:
      signpath_enabled: ${{ steps.signpath.outputs.enabled }}
      certificate_enabled: ${{ steps.cert.outputs.enabled }}
    
    strategy:
      matrix:
        os: [windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # tag 名与 package.json 的 version 必须完全一致。
      #
      # 不一致的后果：latest.yml 里的版本号取自 package.json，而
      # electron-updater 是拿它跟用户当前版本比较来决定要不要更新。
      # 两者一旦对不上，要么永远提示"已是最新"，要么提示一个用户装不上的
      # 版本。这一步把这个错误挡在发布之前。
      # 用 pwsh（PowerShell 7），不要用 shell: powershell
      #
      # GitHub runner 把 run: 写成无 BOM 的 UTF-8 临时 .ps1，Windows PowerShell 5.1
      # 会按 ANSI 码页解码 —— 脚本里只要有中文或破折号，乱码混进的引号就会把字符串截断，
      # 报 "The string is missing the terminator"。pwsh 默认按 UTF-8 读无 BOM 文件，没这问题。
      - name: Verify tag matches package version
        run: node scripts/release/verify-version.js --tag "${GITHUB_REF_NAME}"
        shell: pwsh

      # 设置代码签名证书（可选）
      #
      # ⚠️ **自签名证书已于 2026-10-28 停用** —— 实测它比「完全不签名」更糟：
      # 证书链不受系统信任（Windows 判定 UnknownError），Symantec 之类用云端
      # 信誉做判定的产品还会直接把它归进「无法证明安全的未知程序」。
      # 所以 CERTIFICATE_BASE64 / CERTIFICATE_PASSWORD 两个 secret 现在**留空**，
      # 产物就是未签名的。
      #
      # 这里保留这套机制，是为了将来换成**公共 CA 签发的证书**（OV，路线 D）
      # 时不用改构建流程：把 PFX 的 base64 填回 CERTIFICATE_BASE64、口令填回
      # CERTIFICATE_PASSWORD 即可。SignPath Foundation 那条路不经过这里，
      # 走下面的独立步骤。
      #
      # 签名要同时满足两个条件：
      #   1. CERTIFICATE_BASE64 secret 非空
      #   2. 仓库变量 SIGN_WITH_CERTIFICATE 的值为 true
      # 只满足第 1 条不会签名 —— GitHub 上的 secret 删不掉（只有本人在网页
      # 操作能删），而历史遗留的自签名 PFX 还留在那里。留着它却不加开关，
      # 产物会继续带自签名证书，比不签名更容易被安全软件拦。
      - name: Setup Code Signing Certificate
        id: cert
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          SIGN_WITH_CERTIFICATE: ${{ vars.SIGN_WITH_CERTIFICATE }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERTIFICATE_BASE64)) {
            echo "enabled=false" >> $env:GITHUB_OUTPUT
            echo "No code signing certificate configured, building without code signing"
            exit 0
          }
          if ($env:SIGN_WITH_CERTIFICATE -ne 'true') {
            echo "enabled=false" >> $env:GITHUB_OUTPUT
            echo "SIGN_WITH_CERTIFICATE is not set to 'true', building without code signing"
            exit 0
          }
          echo "enabled=true" >> $env:GITHUB_OUTPUT
          echo "Setting up code signing certificate..."
          $certificateBytes = [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          $certificatePath = Join-Path $env:GITHUB_WORKSPACE "certificate.pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          echo "Certificate file created: $certificatePath"
          if (Test-Path $certificatePath) {
            echo "Certificate file verification successful"
            $fileSize = (Get-Item $certificatePath).Length
            echo "Certificate file size: $fileSize bytes"
          } else {
            echo "Error: Certificate file creation failed"
            exit 1
          }
        shell: pwsh
          
      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-
            
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm --dir src/renderer run build

      - name: Build electron
        run: pnpm run build:electron
        
      - name: Build Electron app (安装版 + 便携版)
        run: |
          $certificatePath = Join-Path $env:GITHUB_WORKSPACE "certificate.pfx"
          if (Test-Path $certificatePath) {
            Write-Host "找到证书，启用代码签名"
            $env:CSC_LINK = $certificatePath
            $env:CSC_KEY_PASSWORD = $env:CERTIFICATE_PASSWORD
          } else {
            Write-Host "没有证书，不签名"
            # 这两个变量必须彻底移除，不能留空字符串 ——
            # PowerShell 7 里 `$env:X = ""` 是「设成空串」而不是「删除变量」，
            # electron-builder 拿到空串的 CSC_LINK 虽说不签名，但下游脚本
            # （build-app.js 判断是否配了证书）会被误导。
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          # --publish never：electron-builder 的默认行为是「在 tag 构建或预发布版本时
          # 自动发布到 GitHub」（build/electron-builder.json 里有 publish 段）。
          # 那样它会自己建一个 v<版本号> 的草稿 Release —— 违反 AGENTS.md 第 3.3 节
          # 「tag 不带 v 前缀」的规矩，还会多出一串同号条目。
          # 正式 Release 由下面的 release 作业用 softprops/action-gh-release 创建，
          # 那里才会带上便携版压缩包。
          # 构建阶段不让 electron-builder 以为自己在 tag 上构建。
          # 它的 getCiTag() 靠 GITHUB_REF_TYPE / GITHUB_REF_NAME 判断，
          # 命中就按「onTag」策略去 GitHub 上发 Release —— 那是本仓库
          # 自己在 release 作业里做的事（softprops/action-gh-release），
          # 两边都做会多出 v<版本号> 的草稿 Release。
          #
          # GITHUB_* 是 GitHub 保留的变量名，在 workflow 的 env: 里改不动
          # （改了不起作用），只能改进程环境变量。
          # 只影响这一步，其他步骤用表达式上下文里的 ref_name 不受影响。
          $env:GITHUB_REF_TYPE = "branch"
          $logPath = Join-Path $env:RUNNER_TEMP "build-app.log"
          & pnpm run build:app -- --publish never 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            # 把失败原因做成注解：注解在运行页面上直接可见，不用翻日志。
            # 头部和尾部都留 —— 报错的关键信息（请求地址、状态码）在中间那段。
            $head = (Get-Content $logPath -TotalCount 40) -join "%0A"
            $tail = (Get-Content $logPath -Tail 200) -join "%0A"
            Write-Host "::error title=打包失败::HEAD %0A$head %0A ====== TAIL ====== %0A$tail"
          }
          exit $exitCode
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/.cache/electron
          ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder
          # 证书口令只从 secret 取，不留默认值 —— 兜底默认值等于把口令写进仓库。
          # 这里用另一个名字，真正要用时才赋给 CSC_KEY_PASSWORD。
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          
      # ------------------------------------------------------------------
      # SignPath Foundation 免费签名（面向符合条件的开源项目）
      #
      # 没配 SIGNPATH_API_TOKEN 就整段跳过，未签名的产物照常发布。
      # 这条链路只有在 SignPath Foundation 申请通过、secret 与 variable 配齐
      # 之后才会真正执行。
      #
      # 顺序不能换：
      #   签名会改变安装包的文件字节 → latest.yml 里记的 sha512 / size 随之失效
      #   → 必须紧接着重算，否则 electron-updater 会因哈希不匹配拒绝安装更新。
      #
      # 人工审批：OSS 计划要求每次签名请求由 Approver 批准。action 默认等
      # 600 秒，这里放宽到 30 分钟；超时就重跑这个 job，签名请求会重新提交。
      # ------------------------------------------------------------------
      - name: Check SignPath configuration
        id: signpath
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN)) {
            echo "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "未配置 SIGNPATH_API_TOKEN，跳过 SignPath 签名"
          } else {
            echo "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Host "已配置 SignPath，开始签名流程"
          }
        shell: pwsh

      # SignPath 要求：产物必须先作为 workflow artifact 上传，
      # 它据此校验「这份文件确实由本仓库的 CI 构建出来」。
      - name: Upload unsigned installer for signing
        id: upload-unsigned-installer
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-installer
          path: dist_electron/QNote-Setup-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          # 产物配置里把安装包路径与版本元数据都写成 ${version}，
          # 值在这里传 —— tag 名就是版本号（前面已校验过与 package.json 一致）。
          parameters: |
            version: "${{ github.ref_name }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: dist_electron/signed

      - name: Replace installer with signed one
        if: steps.signpath.outputs.enabled == 'true'
        run: |
          $signed = Get-ChildItem -Path dist_electron/signed -Recurse -Filter 'QNote-Setup-*.exe' |
            Select-Object -First 1
          if (-not $signed) {
            throw "签名产物里没有找到安装包，检查 SignPath 的产物配置是否匹配"
          }
          Copy-Item $signed.FullName -Destination (Join-Path $env:GITHUB_WORKSPACE "dist_electron") -Force
          Write-Host "已用签名后的安装包替换原文件"
        shell: pwsh

      # 未签名的副本不能留在 artifact 里 —— release 作业会按 *.exe 通配，
      # 留着等于把没签名的安装包也发到 Release 上。
      #
      # 这里直接调 GitHub 的 REST 接口删，不引第三方 action：官方仓库
      # actions/delete-artifact 已经不存在了（GitHub 解析 action 失败会直接
      # 让整个 job 在「Set up job」阶段挂掉，仓库地址返回 404）。
      # runner 自带 PowerShell，用 Invoke-RestMethod 就够。
      - name: Remove unsigned artifact
        if: always() && steps.signpath.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
        run: |
          if ([string]::IsNullOrEmpty($env:ARTIFACT_ID)) {
            Write-Host "没有拿到 artifact id，跳过删除"
            exit 0
          }
          $headers = @{
            'Authorization' = "Bearer $env:GH_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'User-Agent' = 'github-actions'
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$env:ARTIFACT_ID"
          try {
            Invoke-RestMethod -Method Delete -Headers $headers -Uri $uri
            Write-Host "已删除未签名 artifact: $env:ARTIFACT_ID"
          } catch {
            # 删不掉不拦发版：artifact 的保留期是 1 天，到期自动清掉；
            # 而且 release 作业只下载 *-build，未签名的副本到不了 Release。
            Write-Host "删除未签名 artifact 失败（不影响发版）：$($_.Exception.Message)"
          }
        shell: pwsh

      - name: Refresh update-info hashes
        if: steps.signpath.outputs.enabled == 'true'
        run: node scripts/release/patch-update-info.js
        shell: pwsh

      # 签名体检：产物的签名链状态 + SHA256 清单
      #
      # 必须在「Process portable version」之前跑 —— 那一步把 win-unpacked 打成
      # zip 之后会把目录删掉，而体检要逐个检查解包目录里的可执行文件。
      #
      # 只报告、不失败：签名不合格得靠换证书解决，不该把发版流程卡死。
      # 报告留在构建日志里；SHA256SUMS.txt 随 Release 一起发布，企业安全团队
      # 可以按哈希加白名单，用户也可以核对文件有没有被替换。
      - name: Verify code signatures
        run: node scripts/build/verify-signature.js
        shell: pwsh

      - name: Process portable version
        run: node scripts/build/post-build.js
        
      - name: Clean up certificate
        if: always()
        run: |
          $certificatePath = Join-Path $env:GITHUB_WORKSPACE "certificate.pfx"
          if (Test-Path $certificatePath) {
            Remove-Item $certificatePath -Force
            echo "Certificate file cleaned up: $certificatePath"
          } else {
            echo "Certificate file does not exist, no cleanup needed"
          }
        shell: pwsh
        
      - name: List build results
        run: |
          echo "构建结果:"
          Get-ChildItem -Path dist_electron -Force
          echo "查找zip文件:"
          Get-ChildItem -Path dist_electron -Filter "*.zip" -Recurse | ForEach-Object { Write-Host $_.FullName }
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.os }}-build
          path: |
            dist_electron/*.exe
            dist_electron/*.zip
            # latest.yml 是自动更新的元数据文件 —— 里面记着安装包文件名、
            # 版本号与 SHA512。electron-updater 先下载它，再据此下载安装包。
            # 少传这一个文件，"检查更新"就会报「找不到 latest.yml」。
            dist_electron/latest.yml
            # SHA256 清单 —— 供用户与企业安全团队核对文件指纹
            dist_electron/SHA256SUMS.txt
          retention-days: 30

  # -----------------------------------------------------------------------
  # macOS 构建
  #
  # 与 Windows 那条链路完全分开，原因是三条硬约束：
  #
  #   1. dmg / .app 只能在 macOS runner 上打 —— electron-builder 不支持交叉
  #      构建 mac 产物，在 Windows / Linux 上打不出能用的 .app；
  #   2. Windows 链路里的证书、SignPath、便携版压缩包、rcedit 全是 Windows
  #      专属的东西，混在一条作业里只会互相干扰；
  #   3. mac 自动更新靠 zip 产物（dmg 不支持差分更新），
  #      所以 target 必须同时包含 dmg 和 zip。
  #
  # 两个架构在**同一次** electron-builder 调用里出（--arm64 --x64）：
  # electron-builder 只会写一份 latest-mac.yml，分两次跑会各写一份，
  # 发到同一个 Release 时会互相覆盖。
  # -----------------------------------------------------------------------
  build-mac:
    name: Build macOS (arm64 + x64)
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    # Release 页正文要说明 mac 产物是否已签名 / 已公证
    outputs:
      signed: ${{ steps.apple-signing.outputs.signed }}
      notarized: ${{ steps.apple-signing.outputs.notarized }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm --dir src/renderer run build

      - name: Build electron
        run: pnpm run build:electron

      # ------------------------------------------------------------------
      # Apple 开发者证书 + 公证凭据（可选）
      #
      # 没配 MAC_CSC_LINK、或者开关 SIGN_WITH_APPLE_CERTIFICATE 没打开，
      # 就出未签名包 —— 未签名包第一次打开会被 Gatekeeper 拦（要右键 → 打开），
      # 而且 mac 上的自动更新要求应用已签名。
      #
      # 证书**不用**手动导入钥匙串：electron-builder 自己会建临时钥匙串、
      # 导入 CSC_LINK 指向的 p12、再签名（见 app-builder-lib 的 macCodeSign）。
      #
      # 公证需要 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 三件套齐全。
      # 少一个 electron-builder 会直接抛 InvalidConfigurationError 把构建打断，
      # 所以这里要么三个都给，要么一个都不给。
      # ------------------------------------------------------------------
      - name: Check Apple signing configuration
        id: apple-signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          SIGN_WITH_APPLE_CERTIFICATE: ${{ vars.SIGN_WITH_APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Append-Env([string]$line) {
            # 用 AppendAllText 而不是 Out-File：PowerShell 7 的 Out-File -Encoding utf8
            # 虽然不带 BOM，但显式走 .NET API 更稳，不会因为编码差异把
            # GITHUB_ENV 的第一行变成带 BOM 的垃圾。
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "$line`n")
          }

          $signed = $false
          $notarized = $false

          if ([string]::IsNullOrEmpty($env:MAC_CSC_LINK) -or $env:SIGN_WITH_APPLE_CERTIFICATE -ne 'true') {
            Write-Host "未配置 Apple 证书（或开关未打开），本次产出未签名包"
          }
          else {
            $signed = $true
            Write-Host "已配置 Apple 证书，启用代码签名"
            Append-Env "CSC_LINK=$env:MAC_CSC_LINK"
            Append-Env "CSC_KEY_PASSWORD=$env:MAC_CSC_KEY_PASSWORD"

            if ([string]::IsNullOrEmpty($env:APPLE_ID) -or [string]::IsNullOrEmpty($env:APPLE_APP_SPECIFIC_PASSWORD) -or [string]::IsNullOrEmpty($env:APPLE_TEAM_ID)) {
              Write-Host "公证凭据不完整，跳过公证（只签名）"
            }
            else {
              $notarized = $true
              Write-Host "公证凭据齐全，启用公证"
              Append-Env "APPLE_ID=$env:APPLE_ID"
              Append-Env "APPLE_APP_SPECIFIC_PASSWORD=$env:APPLE_APP_SPECIFIC_PASSWORD"
              Append-Env "APPLE_TEAM_ID=$env:APPLE_TEAM_ID"
            }
          }

          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "signed=$($signed.ToString().ToLower())`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "notarized=$($notarized.ToString().ToLower())`n")

      - name: Build macOS app
        # --publish never：正式 Release 由下面的 release 作业创建。
        # 不加这个参数，electron-builder 看到 tag 会自己去 GitHub 建一份
        # 带 v 前缀的草稿 Release（违反 AGENTS.md 第 3.3 节）。
        #
        # GITHUB_REF_TYPE 是 GitHub 保留变量名，在 workflow 的 env: 里改不动，
        # 只能改进程环境变量 —— 改成 branch 是为了让 electron-builder 以为
        # 自己不在 tag 上。
        run: |
          export GITHUB_REF_TYPE="branch"
          pnpm run build:app -- --mac --arm64 --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/Library/Caches/electron
          ELECTRON_BUILDER_CACHE: ~/Library/Caches/electron-builder

      - name: List build results
        run: Get-ChildItem -Path dist_electron -Force
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          # 名字必须以 -build 结尾 —— release 作业按 "*-build" 下载
          name: mac-build
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            # latest-mac.yml 是 mac 自动更新的元数据文件（Windows 那份是 latest.yml）。
            # 少传这一个文件，mac 用户点「检查更新」就会报「找不到更新源」。
            dist_electron/latest-mac.yml
            # blockmap 是差分更新的依据 —— electron-updater 按 <产物名>.blockmap
            # 去 Release 上取，算出要传哪些块。缺了它不会报错，但会退化成整包下载
            # （mac 的 zip 约 205MB，每次更新全量拉并不划算）。
            dist_electron/*.blockmap
          retention-days: 30

  release:
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # always()：mac 作业失败不该连累 Windows 发版（两个平台的构建互相独立）。
    # 但 Windows 构建本身失败时仍然不发 —— 那时 Release 里没有可用的安装包。
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      # 只下载正式产物（*-build）。签名那步还会另外上传一个
      # unsigned-installer —— 那里面是没签名的安装包，绝不能进 Release。
      # 上一步会删它，这里再加一道按名字筛选，删失败也不会漏出去。
      #
      # Windows 与 macOS 分开下载：mac 产物默认不进正式 Release，
      # 未签名的 .dmg 被 Gatekeeper 拦，用户体验反而更差。
      # 打开仓库变量 MAC_RELEASE_ENABLED 之后 mac 产物才会一起发布。
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: "windows-*-build"
          path: artifacts

      - name: Download macOS build artifacts
        # 显式打开开关，或者产物已签名且已公证（这种包用户双击就能开，
        # 没有 Gatekeeper 的问题，不必等维护者手动开开关）。
        if: vars.MAC_RELEASE_ENABLED == 'true' || (needs.build-mac.outputs.signed == 'true' && needs.build-mac.outputs.notarized == 'true')
        # mac 构建失败时不阻断发版 —— Windows 的产物照常发布。
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: "mac-*-build"
          path: artifacts-mac
          
      - name: List downloaded artifacts
        run: |
          echo "下载的构建文件:"
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "latest.yml" \) | sort
          if [ -d artifacts-mac ]; then
            echo "下载的 macOS 构建文件:"
            find artifacts-mac -type f \( -name "*.dmg" -o -name "*.zip" -o -name "latest-mac.yml" \) | sort
          fi

      # 汇总要发布的文件清单与 macOS 说明段。
      # files 不能在 workflow 里按条件写死，所以在这里算好再传给 action。
      - name: Prepare release assets
        id: release-assets
        env:
          MAC_RELEASE_ENABLED: ${{ vars.MAC_RELEASE_ENABLED }}
          MAC_SIGNED: ${{ needs.build-mac.outputs.signed }}
          MAC_NOTARIZED: ${{ needs.build-mac.outputs.notarized }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $files = @(
            'artifacts/**/*.exe',
            'artifacts/**/*.zip',
            # 自动更新元数据 —— 必须与安装包在同一个 Release 里，
            # electron-updater 会按 /releases/download/<tag>/latest.yml 取它。
            'artifacts/**/latest.yml',
            # 哈希清单 —— 供用户与企业安全团队核对文件指纹
            'artifacts/**/SHA256SUMS.txt'
          )

          $macNotes = @()

          # mac 产物进正式 Release 的条件：
          #   - 显式打开仓库变量 MAC_RELEASE_ENABLED（=true）；或者
          #   - 产物已签名且已公证 —— 这种包用户双击就能开，没有 Gatekeeper 的问题，
          #     不必再等维护者手动开开关。
          # 两个条件都没满足时，mac 产物只留在 Actions Artifact 里。
          $macReady = (Test-Path 'artifacts-mac')
          $macSignedOk = ($env:MAC_SIGNED -eq 'true' -and $env:MAC_NOTARIZED -eq 'true')
          if ($macReady -and ($env:MAC_RELEASE_ENABLED -eq 'true' -or $macSignedOk)) {
            $files += @(
              'artifacts-mac/**/*.dmg',
              'artifacts-mac/**/*.zip',
              # mac 自动更新的元数据（Windows 那份是 latest.yml）
              'artifacts-mac/**/latest-mac.yml',
              # 差分更新的依据，必须与产物在同一个 Release 里
              'artifacts-mac/**/*.blockmap'
            )

            $macNotes += '## 🍎 macOS 版本'
            $macNotes += ''
            $macNotes += '- **QNote-x.x.x-mac-arm64.dmg**: Apple Silicon（M 系列）'
            $macNotes += '- **QNote-x.x.x-mac-x64.dmg**: Intel'
            $macNotes += ''

            if ($env:MAC_SIGNED -eq 'true' -and $env:MAC_NOTARIZED -eq 'true') {
              $macNotes += 'macOS 应用已用 Developer ID 签名并通过 Apple 公证，下载后双击即可打开。'
            }
            elseif ($env:MAC_SIGNED -eq 'true') {
              $macNotes += 'macOS 应用已用 Developer ID 签名，但没有通过 Apple 公证。首次打开可能需要在「系统设置 → 隐私与安全性」里点「仍要打开」。'
            }
            else {
              $macNotes += 'macOS 应用**未签名**。第一次打开会被 Gatekeeper 拦住，需要右键点击应用 → 「打开」，或者执行：'
              $macNotes += ''
              $macNotes += '```'
              $macNotes += 'xattr -dr com.apple.quarantine /Applications/QNote.app'
              $macNotes += '```'
              $macNotes += ''
              $macNotes += '另外，macOS 要求更新包与已安装应用使用同一签名，**未签名的 mac 版无法自动更新**。'
            }
            $macNotes += ''
          }

          # 用 heredoc 形式写多行输出（GitHub 的 GITHUB_OUTPUT 语法）
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "files<<QNOTE_EOF`n" + ($files -join "`n") + "`nQNOTE_EOF`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "mac_notes<<QNOTE_EOF`n" + ($macNotes -join "`n") + "`nQNOTE_EOF`n")

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # Release 标题要带产品名（AGENTS.md 第 3.3 节）。
          # 不写 name 时 action 直接拿 tag 名当标题，Release 列表里
          # 就只剩一串光秃秃的版本号，看不出是哪个产品。
          name: QNote ${{ github.ref_name }}
          files: ${{ steps.release-assets.outputs.files }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📦 下载说明

            - **QNote-Setup-x.x.x.exe**: 安装版，推荐大多数用户使用
            - **QNote-x.x.x-portable.zip**: 便携版压缩包，解压后可直接运行

            ${{ steps.release-assets.outputs.mac_notes }}
            ## 🔄 自动更新

            安装版支持在「设置 → 数据与开发 → 应用更新」里检查、下载并安装新版本。
            更新包下载完成后会校验 SHA512。若自动更新不可用，可在本页面手动下载。

            ## 🔒 安全说明

            ${{ (needs.build.outputs.signpath_enabled == 'true' && '安装包带 Authenticode 数字签名（证书由 SignPath Foundation 签发），可在「文件属性 → 数字签名」里查看签名信息。') || (needs.build.outputs.certificate_enabled == 'true' && '安装包带 Authenticode 数字签名，可在「文件属性 → 数字签名」里查看签名信息。') || '本版本安装包不带数字签名 —— 自签名证书已停用，因为它比完全不签名更容易被安全软件判定为风险。请用同目录的 `SHA256SUMS.txt` 核对文件指纹。' }}

            `SHA256SUMS.txt` 给出各产物的 SHA256，可用
            `sha256sum -c SHA256SUMS.txt` 核对文件有没有被替换。

            企业网络里若被安全软件拦截（提示未知发布者、签名无效、恶意软件等），
            请把 `SHA256SUMS.txt` 里的哈希提交给 IT 安全团队加白名单。

            ## 🔐 Code signing policy

            ${{ (needs.build.outputs.signpath_enabled == 'true' && 'Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).') || (needs.build.outputs.certificate_enabled == 'true' && 'The Windows installer carries an Authenticode digital signature issued under a public CA certificate.') || 'The Windows installer is currently not code signed. Verify it against SHA256SUMS.txt before running it. Certificate details, team roles, privacy statement and uninstall instructions are listed in the code signing policy.' }}

            签名覆盖范围、团队角色、隐私声明与卸载说明：
            ${{ vars.SIGNPATH_POLICY_URL || 'https://github.com/Ruciazyt/qnote-elec' }}

            ### 便携版使用方法
            1. 下载 `QNote-x.x.x-portable.zip` 文件
            2. 解压到任意文件夹
            3. 双击 `QNote.exe` 即可运行
            4. 便携版不支持自动更新，升级需重新下载解压

            ## ✨ 更新内容

            详见下方自动生成的更新日志。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
