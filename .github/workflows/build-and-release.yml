name: Build and Release

# -----------------------------------------------------------------------
# 正式发布 —— 由版本号 tag 触发。
#
# tag 名 = 版本号本身，MAJOR.MINOR.PATCH 三段纯数字，**不带 v 前缀**
# （AGENTS.md 第 3.3 节）。例：1.0.19
#
# 所以触发模式用 [0-9]+ 三段数字，而不是 v* —— 早先混用过 v1.0.x 与
# 1.0.<commit 数> 两种形态，Release 列表因此出现两串同号条目。
# -----------------------------------------------------------------------

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    
    strategy:
      matrix:
        os: [windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # tag 名与 package.json 的 version 必须完全一致。
      #
      # 不一致的后果：latest.yml 里的版本号取自 package.json，而
      # electron-updater 是拿它跟用户当前版本比较来决定要不要更新。
      # 两者一旦对不上，要么永远提示"已是最新"，要么提示一个用户装不上的
      # 版本。这一步把这个错误挡在发布之前。
      - name: Verify tag matches package version
        run: node scripts/release/verify-version.js --tag "${GITHUB_REF_NAME}"
        shell: powershell

      # 设置代码签名证书
      - name: Setup Code Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERTIFICATE_BASE64)) {
            echo "No code signing certificate configured, skipping certificate setup"
            exit 0
          }
          echo "Setting up code signing certificate..."
          $certificateBytes = [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          $certificatePath = Join-Path $env:GITHUB_WORKSPACE "certificate.pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          echo "Certificate file created: $certificatePath"
          if (Test-Path $certificatePath) {
            echo "Certificate file verification successful"
            $fileSize = (Get-Item $certificatePath).Length
            echo "Certificate file size: $fileSize bytes"
          } else {
            echo "Error: Certificate file creation failed"
            exit 1
          }
        shell: powershell
          
      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-
            
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm --dir src/renderer run build

      - name: Build electron
        run: pnpm run build:electron
        
      - name: Build Electron app (安装版 + 便携版)
        run: |
          $certificatePath = Join-Path $env:GITHUB_WORKSPACE "certificate.pfx"
          if (Test-Path $certificatePath) {
            echo "Certificate found, building with code signing..."
            $env:CSC_LINK = $certificatePath
          } else {
            echo "No certificate found, building without code signing..."
            $env:CSC_LINK = ""
          }
          pnpm run build:app
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/.cache/electron
          ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder
          CSC_KEY_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD || 'qnote2024' }}
          
      - name: Process portable version
        run: node scripts/build/post-build.js
        
      - name: Clean up certificate
        if: always()
        run: |
          $certificatePath = Join-Path $env:GITHUB_WORKSPACE "certificate.pfx"
          if (Test-Path $certificatePath) {
            Remove-Item $certificatePath -Force
            echo "Certificate file cleaned up: $certificatePath"
          } else {
            echo "Certificate file does not exist, no cleanup needed"
          }
        shell: powershell
        
      - name: List build results
        run: |
          echo "构建结果:"
          Get-ChildItem -Path dist_electron -Force
          echo "查找zip文件:"
          Get-ChildItem -Path dist_electron -Filter "*.zip" -Recurse | ForEach-Object { Write-Host $_.FullName }
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.os }}-build
          path: |
            dist_electron/*.exe
            dist_electron/*.zip
            # latest.yml 是自动更新的元数据文件 —— 里面记着安装包文件名、
            # 版本号与 SHA512。electron-updater 先下载它，再据此下载安装包。
            # 少传这一个文件，"检查更新"就会报「找不到 latest.yml」。
            dist_electron/latest.yml
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          
      - name: List downloaded artifacts
        run: |
          echo "下载的构建文件:"
          find artifacts -type f -name "*.exe" -o -name "*.zip" -o -name "latest.yml" | sort

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            # 自动更新元数据 —— 必须与安装包在同一个 Release 里，
            # electron-updater 会按 /releases/download/<tag>/latest.yml 取它。
            artifacts/**/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📦 下载说明

            - **QNote-Setup-x.x.x.exe**: 安装版（已代码签名），推荐大多数用户使用
            - **QNote-x.x.x-portable.zip**: 便携版压缩包，解压后可直接运行

            ## 🔄 自动更新

            安装版支持在「设置 → 数据与开发 → 应用更新」里检查、下载并安装新版本。
            更新包下载完成后会校验 SHA512。若自动更新不可用，可在本页面手动下载。

            ## 🔒 安全说明

            本版本已使用自签名证书进行代码签名，提高了安全性。
            如果首次运行时系统仍有提示，请选择"仍要运行"。

            ### 便携版使用方法
            1. 下载 `QNote-x.x.x-portable.zip` 文件
            2. 解压到任意文件夹
            3. 双击 `QNote.exe` 即可运行
            4. 便携版不支持自动更新，升级需重新下载解压

            ## ✨ 更新内容

            详见下方自动生成的更新日志。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
