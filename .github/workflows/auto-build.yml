name: Auto Build (验证)


on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.32.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Show build version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "package.json version: $version"
          Write-Host "本次构建不会创建 Release —— 正式发布请打版本号 tag"
        shell: pwsh

      - name: Cache Electron
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
        shell: pwsh

      - name: Verify version format
        run: node scripts/release/verify-version.js

      - name: Build renderer
        run: pnpm --dir src/renderer run build

      - name: Build electron
        run: pnpm run build:electron

      - name: Build Electron app (安装版 + 便携版)
        run: pnpm run build:app -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/.cache/electron
          ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

      - name: Process portable version
        run: node scripts/build/post-build.js

      - name: List build results
        run: |
          Write-Host "构建结果:"
          Get-ChildItem -Path dist_electron -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: qnote-build-${{ github.run_number }}
          path: |
            dist_electron/*.exe
            dist_electron/*.zip
            dist_electron/latest.yml
          retention-days: 30

  build-mac:
    name: Build macOS (arm64 + x64)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.32.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Electron
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version format
        run: node scripts/release/verify-version.js

      - name: Build renderer
        run: pnpm --dir src/renderer run build

      - name: Build electron
        run: pnpm run build:electron

      - name: Build macOS app
        run: |
          export GITHUB_REF_TYPE="branch"
          pnpm run build:app -- --mac --arm64 --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/Library/Caches/electron
          ELECTRON_BUILDER_CACHE: ~/Library/Caches/electron-builder

      - name: List build results
        run: Get-ChildItem -Path dist_electron -Force
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: qnote-mac-build-${{ github.run_number }}
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/latest-mac.yml
            dist_electron/*.blockmap
          retention-days: 30
