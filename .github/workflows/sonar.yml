name: SonarCloud


on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm --dir src/renderer run test:coverage

      - name: Check SonarCloud token
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No SONAR_TOKEN secret configured, skipping SonarCloud scan"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Diagnostics: analysis scope"
        run: |
          {
            echo "### 分析范围"
            echo ""
            echo '```'
            grep -E '^sonar\.(sources|tests|exclusions|css\.exclusions)=' sonar-project.properties
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SonarCloud scan
        if: steps.sonar-token.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CI: ""
        with:
          args: >
            -Dsonar.sources=src/main,src/renderer,src/shared,src/database
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/dist_electron/**,**/build/**,**/.data/**,**/out-tsc/**,**/coverage/**,**/*.d.ts,**/*.min.js,**/public/**,**/*.svg,**/*.png,**/*.ico,**/*.icns,**/*.css,**/*.html

      - name: "Diagnostics: scanner output"
        if: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CI: ""
        run: |
          SCANNER=$(ls -d /opt/hostedtoolcache/sonar-scanner-cli/*/linux-x64/bin/sonar-scanner 2>/dev/null | head -1)
          if [ -z "$SCANNER" ]; then
            echo "::error title=scanner::scanner binary not found under /opt/hostedtoolcache"
            exit 0
          fi
          set +e
          "$SCANNER" \
            -Dsonar.projectKey=Ruciazyt_qnote-elec \
            -Dsonar.projectName=QNote \
            -Dsonar.organization=ruciazyt \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.scm.provider=git \
            -Dsonar.scm.disabled=false \
            -Dsonar.sources=src/main,src/renderer,src/shared,src/database \
            -Dsonar.exclusions='**/node_modules/**,**/dist/**,**/dist_electron/**,**/build/**,**/.data/**,**/out-tsc/**,**/coverage/**,**/*.d.ts,**/*.min.js,**/public/**,**/*.svg,**/*.png,**/*.ico,**/*.icns,**/*.css,**/*.html' \
            > scanner-output.log 2>&1
          code=$?
          {
            grep -Ei 'project root|load properties|sonar\.(sources|tests|exclusions)|module|skipping|indexed|lines of code|excluded|warning|error' scanner-output.log \
              | head -60 \
              | while IFS= read -r line; do
                  safe=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-900)
                  echo "::error title=scanner::${safe}"
                done
            echo "::error title=scanner::scanner exit code ${code}"
          }
          exit 0

      - name: Collect issue list
        if: steps.sonar-token.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_BLOCK_SEVERITIES: ${{ vars.SONAR_BLOCK_SEVERITIES }}
        run: |
          code=0
          node scripts/quality/sonar-issues.js --gate --wait || code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::SonarCloud issues could not be fetched (token or network problem)"
            exit 0
          fi
          exit "$code"

      - name: Upload issue list
        if: always() && steps.sonar-token.outputs.enabled == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: sonar-issues
          path: .data/sonar/
          if-no-files-found: ignore
          retention-days: 14
