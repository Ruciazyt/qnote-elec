name: SonarCloud

# -----------------------------------------------------------------------
# SonarCloud 扫描 —— 推 master 与提 PR 时各跑一次
#
# 这个工作流负责「产生分析结果」；
# 发版时真正阻断的是 build-and-release.yml 里的 sonar-gate 作业，
# 它跑同一个 scripts/quality/sonar-issues.js 判定有没有命中级别的问题。
#
# 令牌来自仓库 secret SONAR_TOKEN。没配的话整个扫描会跳过（不红），
# 免得还没接好就把 CI 搞挂。
#
# 手动触发：Actions 页 → SonarCloud → Run workflow
# -----------------------------------------------------------------------

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    steps:
      # fetch-depth: 0 —— Sonar 要完整 git 历史才能做 blame
      # 与「新增代码」判定，浅克隆会让它把整个仓库都当成新代码。
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # 覆盖率报告：SonarCloud 侧填 src/renderer/coverage/lcov.info
      # 不产出 lcov 的话，覆盖率指标会是 0，质量门禁那一条必然红。
      - name: Run unit tests with coverage
        run: pnpm --dir src/renderer run test:coverage

      - name: Check SonarCloud token
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No SONAR_TOKEN secret configured, skipping SonarCloud scan"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # 把生效的分析范围写进 workflow summary
      #
      # 为什么需要这一步：Actions 的日志要登录才能读（匿名访问返回 403），
      # 但 workflow summary 会进 check run 的 output.summary ——
      # 那个用 REST API 就能读。排查「scanner 到底扫了什么」时，
      # 这一步是唯一能拿到现场的办法。
      - name: "Diagnostics: analysis scope"
        run: |
          {
            echo "### 分析范围"
            echo ""
            echo '```'
            grep -E '^sonar\.(sources|tests|exclusions|css\.exclusions)=' sonar-project.properties
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Scan with the official action (pinned to a full commit SHA).
      #
      # The analysis scope is passed on the command line as well as through
      # sonar-project.properties: command line wins over the properties file,
      # so both places stay in sync and there is nothing left to guess about.
      #
      # Scope covers only the four core directories under src/ (main process,
      # renderer, shared types, data layer). scripts/ is left out on purpose:
      # the free SonarCloud tier counts the whole organization's lines of code
      # and rejects anything above 50000, which blocks the analysis outright.
      #
      # Do NOT pass sonar.tests here. Two ways it goes wrong, both measured:
      #   - identical to sonar.sources -> Sonar drops the scope and scans the
      #     whole repository (60700+ LOC, analysis rejected by the quota)
      #   - a subdirectory of a sources directory -> Sonar drops that whole
      #     parent directory to avoid indexing files twice (98 files left)
      # Test files are marked as tests by sonar.test.inclusions instead.
      # Run the scanner ourselves instead of going through the official action.
      #
      # Two reasons:
      #
      # 1. The action's output only lands in the Actions log, and that log
      #    returns 403 for anonymous requests. Calling the scanner from a run
      #    step keeps its output, and the interesting lines can be turned into
      #    annotations -- those ARE readable through the REST API.
      #
      # 2. SonarCloud has "Automatic Analysis" enabled for this organization:
      #    every push to master makes SonarCloud run an analysis by itself.
      #    That analysis has no client-side configuration, so it always covers
      #    the whole repository (60700+ LOC, rejected by the free tier's
      #    quota). Worse, the scanner refuses to run while both are active:
      #      "You are running CI analysis while Automatic Analysis is enabled.
      #       Please consider disabling one or the other."   (exit code 3)
      #    The scanner decides "this is a CI analysis" by looking at the CI
      #    environment variable; clearing it makes this run look manual, and
      #    the scoped analysis below is the one that lands last -- so it is
      #    the one the quality gate reads.
      #
      # Scope: only the core directories under src/ (main process, renderer,
      # shared types, data layer). scripts/ is left out on purpose -- the free
      # tier counts the whole organization's lines of code and rejects
      # anything above 50000.
      #
      # Do NOT pass sonar.tests. Two ways it goes wrong, both measured:
      #   - identical to sonar.sources -> Sonar drops the scope and scans the
      #     whole repository (60700+ LOC, analysis rejected by the quota)
      #   - a subdirectory of a sources directory -> Sonar drops that whole
      #     parent directory to avoid indexing files twice (98 files left)
      # Test files are marked as tests by sonar.test.inclusions instead.
      - name: SonarCloud scan
        if: steps.sonar-token.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CI: ""
        run: |
          set -uo pipefail
          SCANNER_VERSION="8.3.1-build.16491"
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux.zip" \
            -o "$RUNNER_TEMP/scanner.zip"
          unzip -q "$RUNNER_TEMP/scanner.zip" -d "$RUNNER_TEMP"
          SCANNER=$(ls "$RUNNER_TEMP"/sonar-scanner-cli-*/bin/sonar-scanner 2>/dev/null | head -1)
          if [ -z "$SCANNER" ]; then
            echo "::error title=scanner::scanner binary not found after unzip"
            exit 1
          fi
          chmod +x "$SCANNER"

          set +e
          "$SCANNER" \
            -Dsonar.projectKey=Ruciazyt_qnote-elec \
            -Dsonar.projectName=QNote \
            -Dsonar.organization=ruciazyt \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.scm.provider=git \
            -Dsonar.scm.disabled=false \
            -Dsonar.sources=src/main,src/renderer,src/shared,src/database \
            -Dsonar.test.inclusions='**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**' \
            -Dsonar.exclusions='**/node_modules/**,**/dist/**,**/dist_electron/**,**/build/**,**/.data/**,**/out-tsc/**,**/coverage/**,**/*.d.ts,**/*.min.js,**/public/**,**/*.svg,**/*.png,**/*.ico,**/*.icns,**/*.css,**/*.html' \
            -Dsonar.javascript.lcov.reportPaths=src/renderer/coverage/lcov.info \
            -Dsonar.typescript.lcov.reportPaths=src/renderer/coverage/lcov.info \
            > scanner.log 2>&1
          code=$?

          {
            grep -Ei 'project root|load properties|sonar\.(sources|tests|exclusions)|module|skipping|indexed|lines of code|excluded|WARN|ERROR' scanner.log \
              | head -60 \
              | while IFS= read -r line; do
                  safe=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-900)
                  echo "::error title=scanner::${safe}"
                done
            echo "::error title=scanner::scanner exit code ${code}"
          }
          exit "$code"

      # 清单 + 判定。用 --wait 等本次提交的分析真正算完，
      # 否则查到的还是上一次的旧结果，门禁就成了假通过。
      #
      # 退出码：1 = 查到了命中级别的问题（本次工作流红）；
      #         2 = 判不了（令牌失效 / 网络不通）—— 只告警。
      - name: Collect issue list
        if: steps.sonar-token.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_BLOCK_SEVERITIES: ${{ vars.SONAR_BLOCK_SEVERITIES }}
        run: |
          code=0
          node scripts/quality/sonar-issues.js --gate --wait || code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::SonarCloud issues could not be fetched (token or network problem)"
            exit 0
          fi
          exit "$code"

      - name: Upload issue list
        if: always() && steps.sonar-token.outputs.enabled == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sonar-issues
          path: .data/sonar/
          if-no-files-found: ignore
          retention-days: 14
