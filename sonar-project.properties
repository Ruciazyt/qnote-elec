# -----------------------------------------------------------------------
# SonarCloud 分析配置
#
# 之前这个文件是不存在的 —— SonarCloud 扫描时全靠默认值，
# 「老是有很多问题」里有相当一部分是分析范围失控造成的
# （构建产物、测试夹具、生成文件被当成源码扫）。
#
# 项目地址：https://sonarcloud.io/project/overview?id=Ruciazyt_qnote-elec
# 配套脚本：scripts/quality/sonar-issues.js（清单 + 门禁）
#           scripts/quality/sonar-scan.js（本地扫描，需要 JDK 17+）
# 详细说明见 docs/SONAR.md
# -----------------------------------------------------------------------

sonar.projectKey=Ruciazyt_qnote-elec
sonar.projectName=QNote
sonar.host.url=https://sonarcloud.io

# 组织 key —— 组织页显示的是 Ruciazyt（项目 key 形如 <组织>_<仓库>）
# 项目已存在时这一行不是必需的，留着是为了万一是新建项目也能建对地方。
sonar.organization=Ruciazyt

sonar.sourceEncoding=UTF-8

# -----------------------------------------------------------------------
# 分析范围
#
# 只看**核心代码** —— src/ 下的四个产品代码目录：
#
# src/main    —— Electron 主进程（IPC、窗口、数据库、快捷键）
# src/renderer—— React 渲染层
# src/shared  —— 主进程与渲染层共用的类型
# src/database—— Knex 数据层
#
# ⚠️ scripts/ **已经移出分析范围**（2026-11）。
#
# 为什么移：SonarCloud 免费额度按**组织的代码行数**计，上限 50000 行。
# 之前把 scripts/ 一起扫，本次分析的 LOC 是 60669 行 —— 超限，
# SonarCloud 直接拒绝产生分析（"This analysis will make your organization
# 'ruciazyt' reach the maximum allowed lines limit of 50000"）。
# 没有新分析 = 质量门禁永远是「判不了」，等于形同虚设。
#
# 移出去的是 scripts/pixel-pet/（像素宠物绘图脚本，与产品无关）、
# scripts/check-*.mjs 与 audit-*.mjs（跟项目自己的守卫测试重复的脚本），
# 以及 git-hooks/ 下的钩子。它们的质量由 pnpm run lint 与项目自己的
# 守卫测试负责。
#
# 代价要认：S4036（命令注入）、S5852 / S8786（正则回溯）、S8705（参数注入）
# 这几类原本主要落在 scripts/ 里，现在 Sonar 不再报了。
# scripts/ 里确实有 shell 调用 —— 缓解手段是它们不接收外部输入，
# 且所有 shell 调用都走 scripts/lib/resolve-exe 解析的可执行文件路径，
# 参数一律用数组形式传（execFileSync，不用 exec）。
# -----------------------------------------------------------------------
sonar.sources=src/main,src/renderer,src/shared,src/database

# 测试文件单独归类，Sonar 才不会把它们当源码算覆盖率
sonar.tests=src/main,src/renderer,src/shared,src/database
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/*.test.js

# -----------------------------------------------------------------------
# 排除项
#
# dist/ 与 dist_electron/ 是构建产物（.gitignore 已忽略，但 Sonar
# 只认自己的排除规则，不读 .gitignore）；public/ 下是静态资源；
# *.d.ts 是声明文件；.data/ 是本地数据库。
# -----------------------------------------------------------------------
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist_electron/**,**/build/**,**/.data/**,**/out-tsc/**,**/coverage/**,**/*.d.ts,**/*.min.js,**/public/**,**/*.svg,**/*.png,**/*.ico,**/*.icns,**/*.css,**/*.html

# CSS 单独再排一次
#
# sonar.exclusions 里已经有 **/*.css，但实测上一次分析仍然报出
# css=3076 行 —— 那 3076 行几乎全是 src/renderer/index.css。
# 所以再补一条语言级的排除项兜底：CSS 的行数占配额不算小，
# 而这个项目的样式层是 Tailwind，CSS 规则在它上面大量误报
# （详见下面那段说明），本来就打算不扫。
sonar.css.exclusions=**/*.css

# -----------------------------------------------------------------------
# CSS 不进 SonarCloud 的分析范围
#
# 本项目的样式层是 Tailwind（utility-first），裸 CSS 只有 7 个文件
# （其中 index.css 是主题变量的集中地）。SonarCloud 的 CSS 规则在这套
# 写法上会大量误报：
#
#   · S9440「要尊重 prefers-reduced-motion」×61
#     —— 真实做法是 Tailwind 的 `motion-reduce:` 变体，Sonar 的 CSS
#        分析器看不到类名，只会对着裸 CSS 里的 transition/animation 报警。
#   · S9423「去掉 !important」×34
#     —— 覆盖 Tailwind 工具类必须用 !important，是设计的一部分。
#   · S4666「重复选择器」×15
#     —— index.css 是分节追加的，同一选择器在不同小节出现是常态，
#        合并要动整份 CSS 的级联顺序，单独开一轮做。
#
# CSS 的质量不靠 Sonar 靠**项目自己的守卫测试**：
#   src/renderer/test/contrast-guard.test.ts（对比度）
#   src/renderer/test/ui-guards.test.ts（无障碍与 UI 约定）
# 那两道门禁比 Sonar 的 CSS 分析器更适合这个项目。
#
# 期间已经手工修掉 CSS 里真正有质量问题的部分：
#   · 对比度不足 2 处（字符计数器的浅色/深色两态）
#   · word-break: break-word 废弃写法 6 处
#   · transition: all 未指定属性 4 处
#
# ⚠️ sonar.exclusions 只能有一条 —— 同名属性后者覆盖前者，
# 写成两条会把上面那串目录排除项整个吃掉。所以 CSS 的排除
# 直接并进了上面那一条里。
# -----------------------------------------------------------------------

# 测试夹具里有大量故意写错的代码（对比度守卫的负例、契约测试的假实现），
# 扫它们只会产出一堆无意义的告警
sonar.coverage.exclusions=**/test/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# -----------------------------------------------------------------------
# 覆盖率
#
# 由 `pnpm run test:coverage` 产出（vitest → lcov）。
# sonar-javascript 只认 lcov 路径，SonarCloud 侧要填
# src/renderer/coverage/lcov.info。
# -----------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=src/renderer/coverage/lcov.info
sonar.typescript.lcov.reportPaths=src/renderer/coverage/lcov.info

# -----------------------------------------------------------------------
# SCM
#
# 让 Sonar 能做 blame 与「新增代码」判定。需要完整历史，
# CI 里 checkout 必须带 fetch-depth: 0。
# -----------------------------------------------------------------------
sonar.scm.provider=git
sonar.scm.disabled=false
