[package]
name = "plugin-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `src/shared/plugin/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = "3"
napi-derive = "3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
